name: Weekly data refresh
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Fetch data
        env:
          BUDGET_URL: ${{ vars.BUDGET_URL }}
          DEPT_FIELD: ${{ vars.DEPT_FIELD }}
          AMOUNT_FIELD: ${{ vars.AMOUNT_FIELD }}
        run: python scripts/fetch_data.py
      - name: Build site
        env:
          SOURCE_NAME: ${{ vars.SOURCE_NAME }}
          BUDGET_PAGE_URL: ${{ vars.BUDGET_PAGE_URL }}
        run: python scripts/build_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Automated data refresh"
          git push